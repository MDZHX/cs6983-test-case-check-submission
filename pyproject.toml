[project]
name = "cs6983-test-case-check"
version = "0.1.0"
description = "Email assistant memory test cases (CS 6983, test case check)"
requires-python = ">=3.12"
# Exact versions: the ones the runs were made with. uv.lock pins everything these depend on.
# To change a package: edit this list, then refresh the lock inside the container and rebuild:
#   docker compose run --rm -v "$PWD:/work" -w /work --entrypoint uv testbed lock
#   docker compose build
dependencies = [
    "openai==3.41.0",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
]

[tool.uv]
package = false   # an application run with run.py, not a library to install
